# 負荷をかける側。vLLM の Pod と CPU を取り合わないよう、CPU ノードで別に動かす。
# vLLM のイメージ（8.7GB）は CPU ノードのディスク（20GB）に入りきらず Evicted になったので、軽い Python イメージ + 自作スクリプト（loadgen.py）にした
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
spec:
  enableServiceLinks: false
  nodeSelector:
    eks.amazonaws.com/nodegroup: cpu
  containers:
  - name: loadgen
    image: python:3.12-slim
    command: ["sh", "-c", "pip install -q aiohttp && sleep infinity"]
    resources:
      requests:
        cpu: "1"
