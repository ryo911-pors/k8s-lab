# 負荷をかける側。vLLM の Pod と CPU を取り合わないよう、CPU ノードで別に動かす。
# vllm bench serve を使うため vLLM のイメージ（8.7GB）を載せる。CPU ノードのディスクは 50GB 必要（20GB だと Evicted になった）
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
spec:
  enableServiceLinks: false
  nodeSelector:
    eks.amazonaws.com/nodegroup: cpu
  containers:
  - name: loadgen
    image: vllm/vllm-openai:v0.30.0
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: "1"
