apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  GREETING: "hi hi"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone

  template:
    metadata:
      labels:
        app: capstone
    spec:
      #nodeSelector:
        #gpu: "true"
      #tolerations:
      #- key: gpu
        #operator: Equal
        #value: "true"
        #effect: NoSchedule

      volumes:
        - name: cache
          emptyDir: {}

      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5

        envFrom:
        - configMapRef:
            name: app-config

        volumeMounts:
          - name: cache
            mountPath: /data

---

apiVersion: v1
kind: Service
metadata:
  name: capstone
spec:
  selector:
    app: capstone
  ports:
  - port: 8080
    targetPort: 80