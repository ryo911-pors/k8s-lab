apiVersion: apps/v1
kind: Deployment
metadata:
  name: web2
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web2

  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5